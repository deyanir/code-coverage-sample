name: SonarQube Analysis and code coverage

on:
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: windows-latest
    env:
       SONAR_PROJECT_KEY: "sonar-dotnet-scan"
       SONAR_PROJECT_SOURCES: "" 
       SONAR_TEST_SOURCES: "tests/MySample.Tests"
       SONAR_TEST_FILE: "MySample.Tests.csproj"
    steps:
        - uses: actions/checkout@v2
          with:
            fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        # - name: Set up .NET SDK 6.0
        #   uses: actions/setup-dotnet@v3
        #   with:
        #     dotnet-version: '6.0.x'
        
        # - name: Set up JDK 17
        #   uses: actions/setup-java@v1
        #   with:
        #     java-version: 1.17
        - name: Cache SonarQube packages
          uses: actions/cache@v2
          with:
            path: ~\.sonar\cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar
        - name: Cache SonarQube scanner
          id: cache-sonar-scanner
          uses: actions/cache@v1
          with:
            path: .\.sonar\scanner
            key: ${{ runner.os }}-sonar-scanner
            restore-keys: ${{ runner.os }}-sonar-scanner

        - name: Install SonarQube scanner
          if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
          shell: powershell
          run: |
            New-Item -Path .\.sonar\scanner -ItemType Directory
            dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
        - name: Install SonarQube coverage
          shell: powershell
          run: |
            dotnet tool install --global dotnet-coverage
            
        - name: Build and analyze
          shell: powershell
          run: |
              .\.sonar\scanner\dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT_KEY }}" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_URL }}" /o:"sonar-ad111" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
              dotnet build src/MySample.ClassLibrary/MySample.ClassLibrary.csproj
              .\.sonar\scanner\dotnet-sonarscanner end  /d:sonar.login="${{ secrets.SONAR_SCAN_TOKEN }}"
        - name: Run tests and collect code coverage
          shell: powershell
          run: |
             cd ${{ env.SONAR_TEST_SOURCES }}
             dir
             dotnet-coverage collect "dotnet test ${{ env.SONAR_TEST_FILE }}" -f xml --output "coverage.xml"
